      <p>你正在浏览器中打开项目源码的入口文件。请先启动本地开发服务。</p>
      <p>Windows 用户可安装 Node.js LTS，然后双击同一目录中的 <code>start-studio.cmd</code>。</p>
      <p>也可以在此目录打开终端，先运行 <code>npm ci</code>，再运行 <code>npm run dev</code>。打开终端显示的地址并点击右上角的 ARG Studio。</p>
      <p><a href="./demo/medellin-desktop-demo.html">只想试玩？打开单文件试玩版</a>。</p>

      if (location.protocol === 'file:') document.getElementById('file-help').hidden = false
